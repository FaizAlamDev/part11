name: Periodic Health Check

on:
  workflow_dispatch:
  schedule:
    - cron: '0 1 * * *'

jobs:
  health_check:
    runs-on: ubuntu-latest
    steps:
      - name: Check the deployed service URL
        uses: jtalk/url-health-check-action@v5
        with:
          url: https://part11-cicd.fly.dev
          max-attempts: 3
          retry-delay: 10s
