name: Deployment pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches: [main]
    types: [opened, synchronize]

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install
      - name: Check style
        run: npm run eslint
      - name: Run npm test
        run: npm run test
      - name: Run npm build
        run: npm run build
  deploy:
    needs: [build_and_test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only
        if: ${{ github.event_name == 'push' && !contains(join(github.event.commits.*.message, ' '), '#skip') }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
  notify_success:
    needs: [deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Discord notification (success)
        if: github.event_name == 'push' && !contains(join(github.event.commits.*.message, ' '), '#skip')
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: success
          nofail: false
          nodetail: true
          title: "Deployment Successful! A new version deployed to production"
          description: |
            **Deployment Details**

            **Commit**: \`${{ github.sha }}\`
            **Message**: ${{ github.event.head_commit.message }}
            **Author**: ${{ github.actor }}
  notify_failure:
    needs: [build_and_test, deploy]
    if: ${{ failure() }}
    runs-on: ubuntu-latest
    steps:
      - name: Discord notification (failure)
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: failure
          nofail: false
          title: "Build failed! The pipeline encountered an error"
          description: |
            **Failure Details**

            **Repository**: ${{ github.repository }}
            **Branch**: ${{ github.base_ref }}
            **Commit**: \`${{ github.sha }}\`
            **Message**: ${{ github.event.head_commit.message }}
            **Author**: ${{ github.actor }}
            **Workflow**: ${{ github.workflow }}
            **Job**: ${{ github.job }}

            [View Commit](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})
            [View Workflow Run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details.
  tag_release:
    needs: [deploy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: '0'
      - name: Bump version and push tag
        uses: anothrNick/github-tag-action@1.75.0
        if: ${{ github.event_name == 'push' && !contains(join(github.event.commits.*.message, ' '), '#skip') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BUMP: patch
